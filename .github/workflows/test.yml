name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest -v
      - name: Compile Python files
        run: >-
          python -m py_compile
          netpulse.py
          netpulse_cycles.py
          netpulse_live.py
          test_netpulse_cycles.py
          test_netpulse_live.py
      - name: Validate shell scripts
        run: bash -n install.sh
